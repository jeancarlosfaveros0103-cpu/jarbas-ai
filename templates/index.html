<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Jarbas AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="container">

  <div id="orb-container">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div id="orb"></div>
  </div>

  <div id="status">Jarbas pronto.</div>

  <div id="chat-box">
    <div id="resposta"></div>
  </div>

  <div id="input-area">
    <input id="msg" type="text" placeholder="Fale com o Jarbas..." />
    <button onclick="enviar()">➤</button>
    <button onclick="ouvir()">🎤</button>
  </div>

</div>

<script>
const respostaDiv = document.getElementById("resposta");
const orb = document.getElementById("orb");
const waves = document.querySelectorAll(".wave");
const msg = document.getElementById("msg");
const status = document.getElementById("status");

function falar(texto) {
  const voz = new SpeechSynthesisUtterance(texto);
  voz.lang = "pt-BR";

  orb.classList.add("active");
  waves.forEach(w => w.classList.add("active"));
  status.innerText = "Jarbas falando...";

  voz.onend = () => {
    orb.classList.remove("active");
    waves.forEach(w => w.classList.remove("active"));
    status.innerText = "Jarbas pronto.";
  };

  speechSynthesis.speak(voz);
}

function escreverLetraPorLetra(texto) {
  respostaDiv.innerHTML = "";
  let i = 0;
  const intervalo = setInterval(() => {
    respostaDiv.innerHTML += texto[i];
    i++;
    if (i >= texto.length) clearInterval(intervalo);
  }, 25);
}

function enviar() {
  const texto = msg.value.trim();
  if (!texto) return;

  status.innerText = "Jarbas pensando...";

  fetch("/perguntar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mensagem: texto })
  })
  .then(r => r.json())
  .then(d => {
    escreverLetraPorLetra(d.resposta);
    falar(d.resposta);
  });

  msg.value = "";
}

let recognition;

if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = "pt-BR";

  recognition.onstart = () => {
    status.innerText = "Ouvindo você...";
  };

  recognition.onresult = (event) => {
    const textoFalado = event.results[0][0].transcript;
    msg.value = textoFalado;
    enviar();
  };

  recognition.onerror = () => {
    status.innerText = "Erro no microfone.";
  };
}

function ouvir() {
  if (recognition) recognition.start();
}
</script>

</body>
</html>
