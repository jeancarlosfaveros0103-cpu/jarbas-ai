<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Jarbas AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at center, #0b0f1a, #000);
      color: white;
    }

    /* TOPO */
    #topo {
      padding: 14px;
      text-align: center;
      font-weight: bold;
      background: linear-gradient(90deg, #6f7cff, #00ffd5);
      color: #000;
    }

    /* CHAT */
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #resposta {
      max-width: 700px;
      width: 100%;
      background: rgba(255,255,255,0.06);
      padding: 16px;
      border-radius: 12px;
      min-height: 120px;
      font-size: 18px;
    }

    /* INPUT */
    #input-area {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: rgba(0,0,0,0.6);
    }

    #msg {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    #input-area button {
      padding: 12px 16px;
      border-radius: 50%;
      border: none;
      background: #00ffd5;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="container">

    <div id="topo">JARBAS AI</div>

    <div id="chat-box">
      <div id="resposta">Jarbas aguardando você...</div>
    </div>

    <div id="input-area">
      <input id="msg" type="text" placeholder="Fale com o Jarbas..." />
      <button onclick="enviar()">➤</button>
    </div>

  </div>

  <script>
    const respostaDiv = document.getElementById("resposta");
    const msg = document.getElementById("msg");

    function escreverLetraPorLetra(texto) {
      respostaDiv.innerHTML = "";
      let i = 0;
      const intervalo = setInterval(() => {
        respostaDiv.innerHTML += texto[i];
        i++;
        if (i >= texto.length) clearInterval(intervalo);
      }, 30);
    }

    function enviar() {
      const texto = msg.value.trim();
      if (!texto) return;

      escreverLetraPorLetra("Jarbas ainda está em construção, mas já te ouviu: " + texto);
      msg.value = "";
    }
  </script>
</body>
</html>
