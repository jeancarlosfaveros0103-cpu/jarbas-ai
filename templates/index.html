<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Jarbas AI - Login</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background: #d4a85f;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Jarbas AI</h2>
    <p>Quem está entrando?</p>
    <input id="nome" placeholder="Seu nome">
    <button onclick="entrar()">Entrar</button>
  </div>

  <script>
    function entrar() {
      const nome = document.getElementById("nome").value.trim();

      if (!nome) {
        alert("Digite seu nome");
        return;
      }

      localStorage.setItem("usuario", nome);
      window.location.href = "jarbas.html";
    }
  </script>

</body>
</html>
