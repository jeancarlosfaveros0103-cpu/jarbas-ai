<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jarbas AI</title>

<style>

/* Fundo */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

/* Container */
#container {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* Status */
#status {
  text-align: center;
  padding: 8px;
  font-size: 14px;
  background: #020617;
}

/* Chat */
#chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

/* Mensagens */
.mensagem {
  max-width: 70%;
  padding: 10px 14px;
  margin: 6px;
  border-radius: 15px;
  font-size: 15px;
  word-wrap: break-word;
}

/* Usuário */
.usuario {
  background-color: #007aff;
  color: white;
  margin-left: auto;
  text-align: right;
}

/* Jarbas */
.jarbas {
  background-color: #e5e5ea;
  color: black;
  margin-right: auto;
}

/* Área entrada */
#input-area {
  display: flex;
  padding: 10px;
  background: #020617;
}

#msg {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

/* Botões */
button {
  margin-left: 5px;
  border: none;
  border-radius: 10px;
  padding: 10px;
  font-size: 16px;
  cursor: pointer;
}

/* Imagem */
img.chat-img {
  max-width: 200px;
  border-radius: 10px;
  margin-top: 5px;
}

</style>

</head>

<body>

<div id="container">

<div id="status">Jarbas pronto.</div>

<div id="chat-box"></div>

<div id="input-area">

<input id="msg" type="text" placeholder="Digite aqui..." />

<input id="imagem" type="file" accept="image/*" style="display:none" />

<button onclick="document.getElementById('imagem').click()">📷</button>

<button onclick="enviar()">➤</button>

<button onclick="ouvir()">🎤</button>

</div>

</div>

<script>

const chatBox = document.getElementById("chat-box");
const msgInput = document.getElementById("msg");
const inputImagem = document.getElementById("imagem");
const statusDiv = document.getElementById("status");

let recognition;

/* ===================== */
/* ADICIONAR TEXTO */
/* ===================== */

function adicionarMensagem(texto, tipo) {

  const msgDiv = document.createElement("div");

  msgDiv.className =
    "mensagem " +
    (tipo === "user" ? "usuario" : "jarbas");

  msgDiv.innerText = texto;

  chatBox.appendChild(msgDiv);

  chatBox.scrollTop = chatBox.scrollHeight;
}

/* ===================== */
/* ADICIONAR IMAGEM */
/* ===================== */

function adicionarImagemSrc(src, tipo) {

  const msgDiv = document.createElement("div");

  msgDiv.className =
    "mensagem " +
    (tipo === "user" ? "usuario" : "jarbas");

  const img = document.createElement("img");

  img.className = "chat-img";

  img.src = src;

  msgDiv.appendChild(img);

  chatBox.appendChild(msgDiv);

  chatBox.scrollTop = chatBox.scrollHeight;
}

/* ===================== */
/* ADICIONAR IMAGEM USER */
/* ===================== */

function adicionarImagemUser(file) {

  adicionarImagemSrc(
    URL.createObjectURL(file),
    "user"
  );

}

/* ===================== */
/* ENVIAR */
/* ===================== */

function enviar() {

  const texto = msgInput.value.trim();
  const imagem = inputImagem.files[0];

  if (!texto && !imagem) return;

  if (texto) {
    adicionarMensagem(texto, "user");
  }

  if (imagem) {
    adicionarImagemUser(imagem);
  }

  statusDiv.innerText = "Jarbas pensando...";

  const formData = new FormData();

  formData.append("mensagem", texto);

  if (imagem) {
    formData.append("imagem", imagem);
  }

  fetch("/perguntar", {
    method: "POST",
    body: formData
  })

  .then(r => r.json())

  .then(d => {

    const resposta = d.resposta;

    /* SE FOR IMAGEM */
    if (resposta.startsWith("/static/")) {

      adicionarImagemSrc(
        resposta,
        "jarbas"
      );

    }

    /* SE FOR TEXTO */
    else {

      adicionarMensagem(
        resposta,
        "jarbas"
      );

      falar(resposta);

    }

    statusDiv.innerText =
      "Jarbas pronto.";

  })

  .catch(() => {

    statusDiv.innerText =
      "Erro ao falar com Jarbas.";

  });

  msgInput.value = "";
  inputImagem.value = "";

}

/* ===================== */
/* VOZ */
/* ===================== */

function falar(texto) {

  if (texto.startsWith("/static/"))
    return;

  const voz =
    new SpeechSynthesisUtterance(texto);

  voz.lang = "pt-BR";

  speechSynthesis.speak(voz);

}

/* ===================== */
/* MICROFONE */
/* ===================== */

if (
  "webkitSpeechRecognition" in window ||
  "SpeechRecognition" in window
) {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition = new SpeechRecognition();

  recognition.lang = "pt-BR";

  recognition.onstart = () => {

    statusDiv.innerText =
      "Ouvindo você...";

  };

  recognition.onresult = (event) => {

    const textoFalado =
      event.results[0][0].transcript;

    msgInput.value =
      textoFalado;

    enviar();

  };

}

function ouvir() {

  if (recognition) {

    recognition.start();

  }

}

</script>

</body>
</html>
