<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jarbas AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">

    <div id="orb"></div>

    <div id="chat-box">
        <div id="messages"></div>
    </div>

    <div id="input-area">
        <input id="msg" placeholder="Fale com o Jarbas..." autocomplete="off">
        <button onclick="enviar()">Enviar</button>
    </div>

</div>

<script>
let falando = false;

function falar(texto) {
    const orb = document.getElementById("orb");
    orb.classList.add("pulse");

    const utter = new SpeechSynthesisUtterance(texto);
    utter.lang = "pt-BR";
    utter.rate = 0.95;
    utter.pitch = 0.9;

    utter.onend = () => {
        orb.classList.remove("pulse");
        falando = false;
    };

    speechSynthesis.speak(utter);
}

function escreverLetraPorLetra(texto) {
    const messages = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "bot";
    messages.appendChild(div);

    let i = 0;
    falando = true;

    function escrever() {
        if (i < texto.length) {
            div.innerHTML += texto.charAt(i);
            i++;
            messages.scrollTop = messages.scrollHeight;
            setTimeout(escrever, 30);
        } else {
            falar(texto);
        }
    }
    escrever();
}

function enviar() {
    const input = document.getElementById("msg");
    const texto = input.value.trim();
    if (!texto || falando) return;

    const messages = document.getElementById("messages");

    const userDiv = document.createElement("div");
    userDiv.className = "user";
    userDiv.innerText = texto;
    messages.appendChild(userDiv);

    input.value = "";

    fetch("/perguntar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem: texto })
    })
    .then(res => res.json())
    .then(data => {
        escreverLetraPorLetra(data.resposta);
    });
}
</script>

</body>
</html>
