<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Jarbas AI</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #status {
      margin-bottom: 20px;
      opacity: 0.7;
      font-size: 18px;
    }

    #texto {
      width: 90%;
      max-width: 500px;
      min-height: 120px;
      padding: 15px;
      border-radius: 10px;
      background: #1a1a1a;
      font-size: 18px;
      margin-bottom: 20px;
    }

    #ativar {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #c9a25d; /* rose gold */
      color: black;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="status">Jarbas aguardando...</div>
  <div id="texto"></div>
  <button id="ativar">Ativar Jarbas</button>

  <script>
    const status = document.getElementById("status");
    const texto = document.getElementById("texto");
    const btn = document.getElementById("ativar");

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      status.innerText = "Seu navegador não suporta reconhecimento de voz.";
      btn.style.display = "none";
    } else {
      const rec = new SpeechRecognition();
      rec.lang = "pt-BR";
      rec.continuous = true;
      rec.interimResults = true;

      rec.onstart = () => {
        status.innerText = "🎤 Jarbas ouvindo você...";
        btn.style.display = "none";
      };

      rec.onend = () => {
        rec.start(); // reinicia automaticamente
      };

      rec.onresult = (event) => {
        let final = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const res = event.results[i];
          if (res.isFinal) {
            final += res[0].transcript + " ";
          }
        }

        if (final) {
          texto.innerText += final;
        }
      };

      btn.onclick = () => {
        rec.start(); // aqui o navegador pede permissão do microfone
      };
    }
  </script>

</body>
</html>
