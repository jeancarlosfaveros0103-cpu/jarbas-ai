<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jarbas AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="container">

    <!-- BOLINHA COM ONDAS -->
    <div id="orb-container">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div id="orb"></div>
    </div>

    <!-- CHAT BOX -->
    <div id="chat-box">
        <div id="resposta"></div>
    </div>

    <!-- INPUT -->
    <div id="input-area">
        <input id="msg" type="text" placeholder="Fale com o Jarbas..." />
        <button onclick="enviar()">Enviar</button>
    </div>

</div>

<script>
const respostaDiv = document.getElementById("resposta");
const orb = document.getElementById("orb");
const waves = document.querySelectorAll(".wave");

// FUNÇÃO DE VOZ
function falar(texto) {
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = "pt-BR";

    orb.classList.add("active");
    waves.forEach(w => w.classList.add("active"));

    voz.onend = () => {
        orb.classList.remove("active");
        waves.forEach(w => w.classList.remove("active"));
    };

    speechSynthesis.speak(voz);
}

// FUNÇÃO PARA ESCREVER LETRA POR LETRA
function escreverLetraPorLetra(texto) {
    respostaDiv.innerHTML = "";
    let i = 0;
    const intervalo = setInterval(() => {
        respostaDiv.innerHTML += texto[i];
        i++;
        if (i >= texto.length) clearInterval(intervalo);
    }, 40);
}

// FUNÇÃO PARA ENVIAR MENSAGEM
function enviar() {
    const texto = msg.value.trim();
    if (!texto) return;

    fetch("/perguntar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem: texto })
    })
    .then(r => r.json())
    .then(d => {
        escreverLetraPorLetra(d.resposta);
        falar(d.resposta);
    });

    msg.value = "";
}
</script>

</body>
</html>
