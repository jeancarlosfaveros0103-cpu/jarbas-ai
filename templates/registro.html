<!DOCTYPE html>
<html>
<head>
<title>Registro</title>
</head>

<body>

<h2>Criar Conta</h2>

<form method="POST">

<input type="text"
name="nome"
placeholder="Nome"
required>

<br>

<input type="email"
name="email"
placeholder="Email"
required>

<br>

<input type="password"
name="senha"
placeholder="Senha"
required>

<br>

<input type="password"
name="confirmar"
placeholder="Confirmar Senha"
required>

<br>

<button type="submit">
Cadastrar
</button>

</form>

<a href="/login">
Voltar ao login
</a>

</body>
</html>
